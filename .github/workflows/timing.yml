name: Publish-time survey

# Measures when each source publishes (pipeline/tools/timing.js) and commits
# ops/publish-times.md. Run by hand, at different times of day, to see the
# pattern; the collection schedule in daily.yml is set from it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pipeline/tools/timing.js --write
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops
          git diff --cached --quiet && exit 0
          git commit -m "Publish-time survey $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || true; sleep 5; done
          exit 1
